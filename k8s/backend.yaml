apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
spec:
  replicas: 2 # Scale your API server
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend-api
        image: mern-backend:v1 # Image you built locally
        ports:
        - containerPort: 5050
        env:
        - name: MONGO_URI
          value: "mongodb://mongo-service:27017" # Points to the mongo-service
        - name: PORT
          value: "5050"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service # Frontend will connect using "http://backend-service:5050/..."
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5050
      targetPort: 5050
  type: ClusterIP # Only accessible from within the cluster